name: TypeScript tRPC Opto-Sync E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify immutable Opto-Sync source pins
        run: |
          test "$(git -C vendor/opto-sync-clients rev-parse HEAD)" = "$(node -p "require('./opto-sync-pin.json').clientsCommit")"
          test "$(git -C vendor/opto-sync-clients/syncer.c rev-parse HEAD)" = "$(node -p "require('./opto-sync-pin.json').coreCommit")"
